spring:
  application:
    name: cim-portal
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  cors:
    # Web 同源部署无需 CORS;前端独立部署时在对应 profile 配置 allowed-origins
    allowed-origins: []

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
    username: ${DB_USER:cim_portal}
    password: ${DB_PASSWORD:cim_portal}
    driver-class-name: oracle.jdbc.OracleDriver
  flyway:
    locations: classpath:db/migration/oracle
app:
  security:
    mode: dev-jwt
  cors:
    allowed-origins:
      - http://localhost:5173

---
spring:
  config:
    activate:
      on-profile: uat
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    locations: classpath:db/migration/oracle
app:
  security:
    mode: oidc

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    locations: classpath:db/migration/oracle
app:
  security:
    mode: oidc
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: test
app:
  security:
    mode: dev-jwt

