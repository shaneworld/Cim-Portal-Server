spring:
  application:
    name: cim-portal
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mariadb://127.0.0.1:3306/cim_portal
    username: cim_portal
    password: cim_portal
  flyway:
    locations: classpath:db/migration/mariadb
app:
  security:
    mode: dev-jwt

---
spring:
  config:
    activate:
      on-profile: uat
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    locations: classpath:db/migration/oracle
  security:
    oauth2:
      resourceserver:
        jwt:
          # TODO(hardening): 一旦确定真实 IdP 的 audience,补充 audience 校验(默认 issuer-uri 仅校验签名+iss+时效,不校验 aud)
          issuer-uri: ${OIDC_ISSUER_URI}
app:
  security:
    mode: oidc

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    locations: classpath:db/migration/oracle
  security:
    oauth2:
      resourceserver:
        jwt:
          # TODO(hardening): 一旦确定真实 IdP 的 audience,补充 audience 校验(默认 issuer-uri 仅校验签名+iss+时效,不校验 aud)
          issuer-uri: ${OIDC_ISSUER_URI}
app:
  security:
    mode: oidc
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: test
  autoconfigure:
    exclude:
      # TODO: GraalVM-21.3-in-container metrics NPE workaround (test only). If dev/uat/prod
      # ever run on GraalVM native image, verify SystemMetricsAutoConfiguration there too.
      - org.springframework.boot.actuate.autoconfigure.metrics.SystemMetricsAutoConfiguration
app:
  security:
    mode: dev-jwt
