spring:
  application:
    name: cim-portal
  autoconfigure:
    exclude:
      # GraalVM 21.3(JDK17)在本机容器化 cgroup 下,ProcessorMetrics 会触发 NPE。
      # 这是运行 JVM 环境问题(非业务逻辑),全局禁用该 actuator 系统指标自配置:
      # 仅去掉系统级指标,健康检查与全部业务功能不受影响。所有 profile 生效。
      - org.springframework.boot.actuate.autoconfigure.metrics.SystemMetricsAutoConfiguration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mariadb://127.0.0.1:3306/cim_portal
    username: cim_portal
    password: cim_portal
  flyway:
    locations: classpath:db/migration/mariadb
app:
  security:
    mode: dev-jwt

---
spring:
  config:
    activate:
      on-profile: uat
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    locations: classpath:db/migration/oracle
  security:
    oauth2:
      resourceserver:
        jwt:
          # TODO(hardening): 一旦确定真实 IdP 的 audience,补充 audience 校验(默认 issuer-uri 仅校验签名+iss+时效,不校验 aud)
          issuer-uri: ${OIDC_ISSUER_URI}
app:
  security:
    mode: oidc

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    locations: classpath:db/migration/oracle
  security:
    oauth2:
      resourceserver:
        jwt:
          # TODO(hardening): 一旦确定真实 IdP 的 audience,补充 audience 校验(默认 issuer-uri 仅校验签名+iss+时效,不校验 aud)
          issuer-uri: ${OIDC_ISSUER_URI}
app:
  security:
    mode: oidc
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: test
app:
  security:
    mode: dev-jwt
