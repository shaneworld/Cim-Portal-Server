# Nginx site for AP1 IT CIM Portal — serves the SPA and same-origin reverse-proxies the API.
# Place at /etc/nginx/sites-available/cim-portal.conf and symlink into sites-enabled/.
# Replace server_name + the ssl_certificate paths with real values.

server {
    listen 80;
    listen [::]:80;
    server_name cim-portal.example.com;          # <-- real domain
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cim-portal.example.com;          # <-- real domain

    ssl_certificate     /etc/ssl/cim-portal/fullchain.pem;   # <-- real cert (or certbot)
    ssl_certificate_key /etc/ssl/cim-portal/privkey.pem;     # <-- real key
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /var/www/cim-portal;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build assets — long cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /favicon.svg { try_files $uri =404; }

    # API — same-origin reverse proxy to the backend (localhost)
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /actuator/health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        access_log off;
    }

    # SPA history fallback (vue-router web history)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
