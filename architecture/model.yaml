    tags: ["frontend"]
    confidence: "confirmed"
    evidence_ids: ["ev-fe-pkg", "ev-fe-main", "ev-fe-router"]

  - id: "backend-api"
    name: "Portal API (cim-portal-server)"
    kind: "container"
    c4_level: "container"
    description: "Spring Boot 3.3 stateless OAuth2 resource server (JDK 21). Validates Bearer JWTs from two issuers (portal-internal + company SSO), serves portal + admin REST APIs."
    responsibility: "Authentication/authorization, business logic, persistence, schema migration."
    technology: "Spring Boot 3.3.5, Spring Security OAuth2 Resource Server, JPA/Hibernate, Flyway, JDK 21"
    owned_data: ["Link", "LinkAccessGrant", "EnumValue", "UserInfo", "SecuritySetting"]
    system_of_record: ["Link", "LinkAccessGrant", "EnumValue", "UserInfo", "SecuritySetting"]
    runtime_boundary: "deployable"
    deployable: true
    external: false
    source_paths:
