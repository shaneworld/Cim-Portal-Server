    technology: "OpenID Connect (Authorization Code + PKCE)"
    owned_data: ["User identities (external)", "Sessions (external)"]
    system_of_record: ["User credentials/sessions (external IdP)"]
    runtime_boundary: "external"
    external: true
    source_paths:
      - "cim-portal-client/src/lib/auth/sso.ts"
      - "cim-portal-server/backend/src/main/java/com/cimportal/auth/MultiIssuerJwtDecoder.java"
