    system_of_record: ["Link", "LinkAccessGrant", "EnumValue", "UserInfo", "SecuritySetting"]
    runtime_boundary: "deployable"
    external: false
    source_paths:
      - "cim-portal-client"
      - "cim-portal-server/backend"
    confidence: "confirmed"
    evidence_ids: ["ev-fe-pkg", "ev-be-pom"]

  # ---------- External systems ----------
  - id: "company-sso"
    name: "Company SSO (OIDC IdP)"
    aliases: ["Keycloak (dev/test)", "Corporate Identity Provider"]
    kind: "external_system"
    c4_level: "context"
    description: "Corporate OpenID Connect identity provider. Keycloak is used in dev/test; the company IdP in uat/prod. Authenticates users and issues access tokens."
