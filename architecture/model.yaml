    confidence: "confirmed"
    evidence_ids: ["ev-fe-sso", "ev-be-security", "ev-doc-sso"]

  - id: "local-desktop-app"
    name: "Local Desktop App"
    kind: "external_system"
    c4_level: "context"
    description: "Client-machine .exe launched via a registered custom URL scheme (e.g. mesclient://). If not installed, the browser falls back to a download URL."
