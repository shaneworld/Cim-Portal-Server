    tags: ["backend", "stateless"]
    confidence: "confirmed"
    evidence_ids: ["ev-be-pom", "ev-be-security", "ev-be-portal"]

  - id: "relational-db"
    name: "Relational Database"
    aliases: ["Oracle (uat/prod)", "MariaDB (dev)"]
    kind: "database"
    c4_level: "container"
    description: "Relational store for all portal entities. Oracle in uat/prod; MariaDB in dev. Schema managed by Flyway with parallel oracle/mariadb migration sets (V1–V6)."
