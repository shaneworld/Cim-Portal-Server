  # ---------- Containers ----------
  - id: "spa"
    name: "Web SPA (cim-portal-client)"
    kind: "container"
    c4_level: "container"
    description: "Vue 3 single-page app served to the browser. Public OIDC (PKCE) client; holds the Bearer token; renders dashboard and admin."
    responsibility: "UI, OIDC PKCE login + internal-login fallback, calls the backend with a Bearer token."
    technology: "Vue 3, TypeScript, Vite, Tailwind, Pinia, vue-router, vue-i18n, oidc-client-ts"
    owned_data: ["Auth token (browser localStorage)", "Locale/theme prefs (browser)"]
    system_of_record: []
    runtime_boundary: "deployable"
    deployable: true
    external: false
