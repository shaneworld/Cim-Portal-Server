assumptions: []
unknowns: []
notes:
  - "Auth & Security routes JWT validation by issuer (portal key vs company-SSO JWKS) and maps the configured username claim → employeeId → UserInfo roles/department."
  - "Portal/Home returns ALL active links with a per-link `accessible` flag and hides url/downloadUrl when the user lacks the grant (server-side locked cards)."
  - "Systems of record: be-link (Link, LinkAccessGrant), be-enum (EnumValue), be-settings (SecuritySetting), be-user (UserInfo). be-persistence is the shared JPA+Flyway layer."
